services:
  web:
    image: busybox:1.36-musl
    container_name: app-web-teste
    restart: unless-stopped
    # Cria um index.html mínimo e sobe o httpd em foreground
    command: sh -c "echo 'OK' > /tmp/index.html && httpd -f -p 8080 -h /tmp"
    ports:
      - "8080:8080"
    networks:
      - app_network
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=4M,noexec,nosuid
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32M
    healthcheck:
      # -Y off ignora HTTP_PROXY/HTTPS_PROXY no loopback
      test: ["CMD", "wget", "-q", "-Y", "off", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 2
      start_period: 5s

networks:
  app_network:
    driver: bridge
