services:
  web:
    image: busybox:1.36-musl
    container_name: app-web-teste
    restart: unless-stopped
    # Inicia um servidor HTTP nativo ultraleve (~1MB de RAM)
    command: httpd -f -p 8080 -h /tmp
    ports:
      - "8080:8080"
    networks:
      - app_network
    # Hardening de Segurança
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=4M,noexec,nosuid
    # Limites rigorosos para Raspberry Pi / Low-end VPS
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0"]
      interval: 15s
      timeout: 3s
      retries: 2

networks:
  app_network:
    driver: bridge
