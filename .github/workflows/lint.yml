name: Lint Shell Scripts & YAML

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Validar Shell Scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Executar ShellCheck nos arquivos .sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  yamllint:
    name: Validar Docker Compose (YAML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe do docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
